<head>
  <title>Hybrid Hiring Solutions</title>
  <link rel="icon" href="/assets/icons/hybrid_hiring-alt.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    rel="stylesheet"
  />
  <!--
    Warm the home hero (landing-page LCP) during HTML parse, in parallel with the
    JS bundle, instead of waiting for React to mount and render the <img>. We use
    an Image() request rather than <link rel="preload"> so the browser reuses it
    from cache without emitting a "preloaded but not used" warning when React
    mounts later (see imports/ui/utils/preloadImage.ts).
  -->
  <script>
    (function () {
      var img = new Image();
      try {
        img.fetchPriority = 'high';
      } catch (e) {}
      img.src = '/assets/images/hh_home_header.webp';
    })();
  </script>
</head>

<body>
  <div id="react-target"></div>
</body>
